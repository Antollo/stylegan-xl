[project]
name = "sgxl"
version = "0.1.0"
requires-python = ">=3.9.0,<3.10.0"

dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "numpy>=1.20",
    "click>=8.0",
    "pillow==8.3.1",
    "scipy==1.7.1",
    "requests==2.26.0",
    "tqdm==4.62.2",
    "ninja==1.10.2",
    "matplotlib==3.4.2",
    "imageio==2.9.0",
    "dill==0.3.4",
    "psutil==5.8.0",
    "regex==2022.3.15",
    "imgui==1.3.0",
    "glfw==2.2.0",
    "pyopengl==3.1.5",
    "imageio-ffmpeg==0.4.3",
    "pyspng",
    "ftfy==6.1.1",
    "timm==0.4.12",
    "setuptools==58.0.4",
    "tensorboard==2.7.0",
    "protobuf==3.20.3",
    "lpips<=0.1.4",
    "kornia<=0.8.2",
    "pytorch-msssim<=1.0.0",
    "opencv-python-headless<=4.13.0.92",
    "lmdb<=2.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
override-dependencies = [
    "pillow==8.3.1"
]